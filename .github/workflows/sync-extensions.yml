name: Sync Keiyoushi Extensions

on:
  schedule:
    # Run every 6 hours to stay in sync with upstream
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create repo directory
        run: mkdir -p public/repo

      - name: Download Keiyoushi index
        run: |
          echo "📦 Downloading Keiyoushi extensions index..."
          curl -sL "https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json" -o public/repo/index.min.json
          
          # Verify the download is valid JSON
          if ! python3 -c "import json; json.load(open('public/repo/index.min.json'))" 2>/dev/null; then
            echo "❌ Downloaded file is not valid JSON. Aborting."
            exit 1
          fi
          
          TOTAL=$(python3 -c "import json; data=json.load(open('public/repo/index.min.json')); print(len(data))")
          echo "✅ Successfully downloaded index with $TOTAL extensions."

      - name: Check for changes
        id: changes
        run: |
          git add public/repo/index.min.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected. Extensions are up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected. Will commit and push."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          TOTAL=$(python3 -c "import json; data=json.load(open('public/repo/index.min.json')); print(len(data))")
          
          git add public/repo/index.min.json
          git commit -m "sync: update Keiyoushi extensions mirror ($TOTAL extensions) — $TIMESTAMP"
          git push origin main
          
          echo "🚀 Pushed extension sync update."
