name: Sync Keiyoushi Extensions

on:
  schedule:
    # Run every 6 hours to stay in sync with upstream
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create repo directory
        run: mkdir -p public/repo public/repo/apk

      - name: Download Keiyoushi index and repo metadata
        run: |
          echo "📦 Downloading Keiyoushi extensions index..."
          curl -sL "https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json" -o public/repo/index.min.json
          
          echo "📦 Downloading Keiyoushi repo metadata..."
          curl -sL "https://raw.githubusercontent.com/keiyoushi/extensions/repo/repo.json" -o /tmp/upstream_repo.json
          
          # Verify the index download is valid JSON and modify the apk field to use absolute URLs
          if ! python3 -c "import json; data = json.load(open('public/repo/index.min.json')); [d.update({'apk': 'https://raw.githubusercontent.com/keiyoushi/extensions/repo/apk/' + d['apk']}) for d in data]; json.dump(data, open('public/repo/index.min.json', 'w'), separators=(',', ':'))" 2>/dev/null; then
            echo "❌ Failed to process index.min.json. Aborting."
            exit 1
          fi
          
          # Update repo.json: keep our branding but sync the signing key from upstream
          if python3 -c "import json; json.load(open('/tmp/upstream_repo.json'))" 2>/dev/null; then
            python3 -c "
          import json
          upstream = json.load(open('/tmp/upstream_repo.json'))
          local = json.load(open('public/repo/repo.json'))
          local['meta']['signingKeyFingerprint'] = upstream['meta']['signingKeyFingerprint']
          json.dump(local, open('public/repo/repo.json', 'w'), indent=2)
          print('✅ Updated signing key fingerprint from upstream.')
          "
          else
            echo "⚠️ Could not fetch upstream repo.json, keeping existing repo.json."
          fi
          
          TOTAL=$(python3 -c "import json; data=json.load(open('public/repo/index.min.json')); print(len(data))")
          echo "✅ Successfully downloaded index with $TOTAL extensions."

      - name: Download Keiyoushi icons
        run: |
          echo "🖼️ Downloading Keiyoushi icons..."
          git clone --depth 1 --filter=blob:none --sparse -b repo https://github.com/keiyoushi/extensions.git /tmp/keiyoushi_icons
          cd /tmp/keiyoushi_icons
          git sparse-checkout set icon
          cd -
          rm -rf public/repo/icon
          cp -r /tmp/keiyoushi_icons/icon public/repo/
          echo "✅ Successfully downloaded extension icons."

      - name: Sync Koma releases data
        run: |
          echo "📦 Syncing Koma releases from GitHub API..."
          curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/UDIN-K/KOMA/releases" \
            -o /tmp/koma_releases_raw.json
          
          # Process: keep only needed fields (id, tag_name, name, body, published_at, assets with name/size/browser_download_url)
          python3 -c "
          import json
          try:
              raw = json.load(open('/tmp/koma_releases_raw.json'))
              if not isinstance(raw, list):
                  print('⚠️ Releases response is not a list, skipping.')
                  exit(0)
              releases = []
              for r in raw:
                  assets = []
                  for a in r.get('assets', []):
                      assets.append({
                          'name': a['name'],
                          'size': a['size'],
                          'browser_download_url': a['browser_download_url']
                      })
                  releases.append({
                      'id': r['id'],
                      'tag_name': r['tag_name'],
                      'name': r.get('name', ''),
                      'body': r.get('body', ''),
                      'published_at': r.get('published_at', ''),
                      'assets': assets
                  })
              json.dump(releases, open('public/repo/releases.json', 'w'), separators=(',', ':'))
              print(f'✅ Synced {len(releases)} releases with assets.')
          except Exception as e:
              print(f'⚠️ Could not process releases: {e}')
          "

      - name: Check for changes
        id: changes
        run: |
          git add public/repo/index.min.json public/repo/repo.json public/repo/icon/ public/repo/releases.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected. Extensions are up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected. Will commit and push."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          TOTAL=$(python3 -c "import json; data=json.load(open('public/repo/index.min.json')); print(len(data))")
          
          git add public/repo/index.min.json public/repo/repo.json public/repo/icon/ public/repo/releases.json
          git commit -m "sync: update Keiyoushi extensions mirror ($TOTAL extensions) — $TIMESTAMP"
          git push origin main
          
          echo "🚀 Pushed extension sync update."
